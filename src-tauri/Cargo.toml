[package]
name = "stack-app"
version = "0.1.0"
description = "STACK — local-first music & entertainment system"
authors = ["STACK contributors"]
edition = "2021"

[lib]
name = "stack_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm"] }
rubato = "0.16"
rtrb = "0.3"
lofty = "0.21"
walkdir = "2"
