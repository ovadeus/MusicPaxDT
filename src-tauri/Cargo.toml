[package]
name = "stack-app"
version = "0.1.5"
description = "STACK — local-first music & entertainment system"
authors = ["STACK contributors"]
edition = "2021"

[lib]
name = "stack_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "aiff"] }
rubato = "0.16"
rtrb = "0.3"
lofty = "0.21"
walkdir = "2"
# Already in the dependency tree via tauri (pinned to 0.3.47 in Cargo.lock —
# 0.3.48 breaks tauri-utils/cookie with E0119). Used for recording filenames.
time = { version = "0.3", features = ["local-offset"] }
mp3lame-encoder = "0.2.4"
flacenc = "0.5.1"
reqwest = { version = "0.13.4", features = ["form", "json", "query"] }
base64 = "0.22.1"
tokio = { version = "1.52.3", features = ["time"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-localhost = "2.3.2"
portpicker = "0.1.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["rt", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
# System-audio capture for the visualizer (so YouTube can be visualized with no
# driver install). macos_13_0 enables audio capture.
screencapturekit = { version = "8.0.0", features = ["macos_13_0"] }
# macOS Now Playing: Control Center / menu-bar widget + hardware media keys +
# lock-screen art via the MediaPlayer framework.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSString",
    "NSDictionary",
    "NSValue",
] }
objc2-media-player = { version = "0.3", features = [
    "MPNowPlayingInfoCenter",
    "MPRemoteCommandCenter",
    "MPRemoteCommand",
    "MPRemoteCommandEvent",
    "MPMediaItem",
] }
