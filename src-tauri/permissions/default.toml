# App-command ACL. Required because the release UI is served from
# http://localhost (see tauri-plugin-localhost in lib.rs) — Tauri treats that
# as a remote origin and only allows commands that an explicit app permission
# grants. This lists every STACK command; the capability references it.

[[permission]]
identifier = "allow-app-commands"
description = "Allow the STACK frontend to call all application commands."
commands.allow = [
    "import_folder",
    "list_tracks",
    "update_track_metadata",
    "delete_track",
    "read_image_data_url",
    "artist_bio",
    "set_artist_bio",
    "get_audio_devices",
    "set_output_device",
    "load_track",
    "play",
    "pause",
    "stop",
    "seek",
    "set_volume",
    "now_playing",
    "get_audio_input_devices",
    "start_line_in",
    "set_input_device",
    "set_riaa",
    "set_tone",
    "set_input_gain",
    "set_visualizer",
    "start_viz_capture",
    "stop_viz_capture",
    "check_missing_files",
    "relink_track",
    "start_screen_audio",
    "stop_screen_audio",
    "set_mini_window",
    "engine_status",
    "start_recording",
    "stop_recording",
    "get_settings",
    "set_setting",
    "recording_format_label",
    "integration_status",
    "set_youtube_api_key",
    "set_spotify_credentials",
    "import_stream_url",
    "import_direct_stream",
    "mirror_playlist",
    "radio_top",
    "radio_search",
    "resolve_radio_stream",
    "import_radio_station",
    "musicpax_feed",
    "list_playlists",
    "create_playlist",
    "playlist_tracks",
    "reorder_playlists",
    "add_to_playlist",
    "delete_playlist",
    "rename_playlist",
    "import_mpx_playlist",
    "youtube_search",
    "enrich_integration_status",
    "set_acoustid_key",
    "set_anthropic_key",
    "set_openai_key",
    "propose_enrichment",
    "lookup_track_tags",
    "clean_track_metadata",
    "apply_enrichment",
    "enrich_cost_estimate",
    "ai_assistant_status",
    "ai_assistant_propose",
    "ollama_models",
    "get_broadcast_config",
    "set_broadcast_password",
    "go_live_start",
    "go_live_stop",
    "go_live_status",
]
